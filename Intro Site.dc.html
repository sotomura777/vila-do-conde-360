<script>
(function(){
  var TOTAL = 133.5, avisado = false;
  // as vozes das frases são tocadas pela página-mãe (Site 360), que tem o ecrã
  // de entrada — aqui fica só o relógio que avisa quando a intro termina.
  // a intro começa sempre do zero e some quando chega ao fim
  try { localStorage.setItem('animstage-v3:t', '0'); } catch(e){}
  function tick(){
    var t = 0;
    try { t = parseFloat(localStorage.getItem('animstage-v3:t') || '0'); } catch(e){}
    if (t >= TOTAL - 0.1 && !avisado) { avisado = true; try { window.parent.postMessage({ type: 'vc360:intro-fim' }, '*'); } catch(e){} }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
